name: microscore

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${MICROSCORE_POSTGRES_DB:-microscore}
  POSTGRES_USER: ${MICROSCORE_POSTGRES_USER:-microscore}
  POSTGRES_PASSWORD: ${MICROSCORE_POSTGRES_PASSWORD:-local-demo-only}

x-api-environment: &api-environment
  MICROSCORE_STORAGE_BACKEND: postgresql
  MICROSCORE_DATABASE_URL: postgresql://${MICROSCORE_POSTGRES_USER:-microscore}:${MICROSCORE_POSTGRES_PASSWORD:-local-demo-only}@postgres:5432/${MICROSCORE_POSTGRES_DB:-microscore}
  MICROSCORE_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    command: ["python", "-m", "microscore_api.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    command: ["python", "-m", "microscore_api.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "8010:8010"
    depends_on:
      seed:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

volumes:
  postgres-data:
