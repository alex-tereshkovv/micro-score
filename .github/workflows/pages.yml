name: Deploy static web demo

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "output/pdf/MicroScore_Engineering_Case_Study.pdf"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage admissions evidence PDF
        run: cp output/pdf/MicroScore_Engineering_Case_Study.pdf apps/web/assets/MicroScore_Engineering_Case_Study.pdf

      - name: Upload static web artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
