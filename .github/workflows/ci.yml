name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pip-audit
          python -m pip install --upgrade --upgrade-strategy eager -r requirements.txt

      - name: Audit installed Python dependencies
        run: |
          python -m pip freeze --exclude-editable > /tmp/microscore-installed.txt
          python -m pip_audit --requirement /tmp/microscore-installed.txt --strict

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests

      - name: Check Python syntax
        run: python -m compileall src/microscore src/microscore_api src/train_model.py tests

      - name: Run research smoke test
        run: python src/train_model.py --data data/raw/credit_risk_dataset.csv --top-features 8

      - name: Run regional decision smoke test
        run: python -m microscore --regional --decision --top-features 4

      - name: Check frontend JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/mock-api.js
          node --check apps/web/application-intake.js
          node --check apps/web/portfolio-dashboard.js
          node --check apps/web/risk-detail.js
          node --check scripts/static-demo-smoke.js
          node --check scripts/frontend-workflow-smoke.js
          node --check scripts/application-intake-smoke.js
          node --check scripts/portfolio-dashboard-smoke.js

      - name: Run application intake smoke test
        run: node scripts/application-intake-smoke.js

      - name: Run portfolio dashboard smoke test
        run: node scripts/portfolio-dashboard-smoke.js

      - name: Run static demo smoke test
        run: node scripts/static-demo-smoke.js

      - name: Run frontend workflow smoke test
        run: node scripts/frontend-workflow-smoke.js

  postgresql-migration:
    name: Disposable PostgreSQL migration smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: microscore_ci
          POSTGRES_USER: microscore
          POSTGRES_PASSWORD: microscore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microscore -d microscore_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MICROSCORE_DATABASE_URL: postgresql://microscore:microscore@localhost:5432/microscore_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade --upgrade-strategy eager -r requirements.txt

      - name: Validate PostgreSQL migration smoke contract
        run: |
          psql --version
          python scripts/postgresql-migration-smoke.py --dry-run

      - name: Validate and apply PostgreSQL migration draft
        run: python scripts/postgresql-migration-smoke.py

      - name: Run PostgreSQL repository runtime parity
        env:
          MICROSCORE_STORAGE_BACKEND: postgresql
        run: python scripts/postgresql-runtime-smoke.py

      - name: Run live FastAPI workflow against PostgreSQL
        env:
          MICROSCORE_STORAGE_BACKEND: postgresql
        run: python scripts/live-api-workflow-smoke.py

      - name: Run PostgreSQL backup and disposable restore drill
        run: python scripts/postgresql-backup-restore-smoke.py

  deployment-candidate:
    name: Container deployment candidate smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build and start deployment candidate
        run: docker compose up --build --detach

      - name: Wait for API and web health
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8010/health > /tmp/microscore-health.json \
              && curl --fail --silent http://127.0.0.1:5173/ > /tmp/microscore-index.html; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/microscore-health.json").read_text())
          index = Path("/tmp/microscore-index.html").read_text()
          assert health["status"] == "ok"
          assert health["storage"]["backend"] == "postgresql"
          assert "@" not in health["database"]
          assert "MicroScore" in index
          print(json.dumps({
              "mode": "container-deployment-smoke",
              "api": health["status"],
              "storage": health["storage"]["backend"],
              "web": "ready",
          }, sort_keys=True))
          PY

      - name: Show deployment state
        if: always()
        run: docker compose ps

      - name: Show deployment logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop deployment candidate
        if: always()
        run: docker compose down --volumes --remove-orphans
