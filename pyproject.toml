[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscore"
version = "0.1.0"
description = "Behavioral credit-risk scoring research for microfinance contexts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "xlrd>=2.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
]
app = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
microscore-train = "microscore.cli:main"
microscore-seed-api = "microscore_api.seed:main"

[tool.setuptools.packages.find]
where = ["src"]
