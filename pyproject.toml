[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "senim-risk"
version = "0.1.0"
description = "An interpretable credit-risk system for thin-file borrowers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "Pillow>=10.0",
    "scikit-learn>=1.4",
    "xlrd>=2.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
]
app = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.30",
]
report = [
    "reportlab>=4.2",
    "pypdf>=5.0",
]

[project.scripts]
senim-risk-train = "microscore.cli:main"
senim-risk-seed-api = "microscore_api.seed:main"
senim-risk-web = "microscore_api.dev:main"
microscore-train = "microscore.cli:main"
microscore-seed-api = "microscore_api.seed:main"
microscore-web = "microscore_api.dev:main"

[tool.setuptools.packages.find]
where = ["src"]
